<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="card wide"><h1>License Admin</h1><label>Admin token<input id="token" type="password" placeholder="ADMIN_TOKEN"></label><div class="row"><label>Days<input id="days" type="number" value="30" min="1"></label><label>App ID<input id="appId" value="education-demo"></label><button id="create">Create key</button></div><button id="refresh">Refresh keys</button><pre id="result">Enter your admin token.</pre><div id="keys"></div></main><script>const token=()=>document.querySelector('#token').value;const out=document.querySelector('#result');async function call(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(url,opts);const j= r.status===204?{}:await r.json();if(!r.ok)throw new Error(j.error||j.message||'Request failed');return j}async function refresh(){try{const j=await call('/api/admin/keys');document.querySelector('#keys').innerHTML=j.keys.map(k=>`<div class="key"><b>${k.key}</b><span>${k.appId} · ${k.enabled?'enabled':'disabled'} · expires ${new Date(k.expiresAt).toLocaleDateString()}</span><button onclick="toggle('${k.id}',${!k.enabled})">${k.enabled?'Disable':'Enable'}</button><button onclick="removeKey('${k.id}')">Delete</button></div>`).join('')||'<p>No keys yet.</p>';out.textContent='Loaded '+j.keys.length+' key(s).'}catch(e){out.textContent=e.message}}async function toggle(id,enabled){await call('/api/admin/keys/'+id,{method:'PATCH',body:JSON.stringify({enabled})});refresh()}async function removeKey(id){if(confirm('Delete this key?')){await call('/api/admin/keys/'+id,{method:'DELETE'});refresh()}}document.querySelector('#create').onclick=async()=>{try{const j=await call('/api/admin/keys',{method:'POST',body:JSON.stringify({days:Number(document.querySelector('#days').value),appId:document.querySelector('#appId').value})});out.textContent='Created: '+j.key;refresh()}catch(e){out.textContent=e.message}};document.querySelector('#refresh').onclick=refresh;</script></body></html>
