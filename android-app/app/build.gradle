plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// API origin only (do not append /api; the JS client adds it to each route).
// Override with -PAPI_BASE_URL=https://api.your-domain.tld or API_BASE_URL env var.
def configuredApiOrigin = project.findProperty("API_BASE_URL") ?: System.getenv("API_BASE_URL") ?: "https://bgmiserver-tev5.onrender.com"

android {
    namespace 'com.fireplace.loader'
    compileSdk 34

    defaultConfig {
        applicationId "com.fireplace.loader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "4.6.0"

        buildConfigField "String", "API_BASE_URL", "\"${configuredApiOrigin}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:3001\""
            debuggable true
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${configuredApiOrigin}\""
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    
    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
